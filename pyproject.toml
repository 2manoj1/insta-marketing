[project]
name = "insta-marketing"
version = "0.1.0"
description = "Instagram Influencer Marketing Manager Multi-Agent System using Playwright, Google ADK & Ollama Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49.0",
    "google-adk>=0.1.0",
    "openai>=1.58.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "pytest>=8.3.0",
]

[project.scripts]
insta-marketing = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
